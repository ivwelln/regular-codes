x-backend: &backend
  build: 
    context: ./backend
    target: prod
  environment:
    APP_DB_HOST: db
    APP_DB_NAME: ${DB_NAME:-app}
    APP_DB_USER: ${DB_USER:-app}
    APP_YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID}
  secrets:
    - app_db_password
    - app_yandex_api_key
services:
  db: 
    image: postgres:17
    environment:
      POSTGRES_USER: ${DB_USER:-app}
      POSTGRES_DB: ${DB_NAME:-app}
      POSTGRES_PASSWORD_FILE: /run/secrets/app_db_password
    secrets:
      - app_db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  
  backend:
    <<: *backend
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
  
secrets:
  app_db_password:
    file: ./secrets/app_db_password
  app_yandex_api_key:
    file: ./secrets/app_yandex_api_key

volumes:
  pgdata: