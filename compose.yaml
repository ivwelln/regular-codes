x-backend: &backend
  build: 
    context: ./backend
    target: prod
  environment:
    APP_DB_HOST: db
    APP_DB_NAME: ${DB_NAME:-app}
    APP_DB_USER: ${DB_USER:-app}
    APP_YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID}
  secrets:
    - app_db_password
    - app_yandex_api_key
    - app_session_encryption_key
    - app_admin_password
services:
  db: 
    image: postgres:17
    environment:
      POSTGRES_USER: ${DB_USER:-app}
      POSTGRES_DB: ${DB_NAME:-app}
      POSTGRES_PASSWORD_FILE: /run/secrets/app_db_password
    secrets:
      - app_db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  
  backend:
    <<: *backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 1s
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  discord-bot:
    build:
      context: ./bots/discord
      target: prod
    init: true
    environment:
      BOT_CHANNEL_IDS: ${DISCORD_CHANNEL_IDS}
    secrets:
      - bot_discord_token
    depends_on:
      backend:
        condition: service_healthy

secrets:
  app_db_password:
    file: ./secrets/app_db_password
  app_yandex_api_key:
    file: ./secrets/app_yandex_api_key
  app_session_encryption_key:
    file: ./secrets/app_session_encryption_key
  app_admin_password:
    file: ./secrets/app_admin_password
  bot_discord_token:
    file: ./secrets/bot_discord_token

volumes:
  pgdata: