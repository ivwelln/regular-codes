[project]
name = "regular-codes-backend"
version = "0.1.0"
description = "Приложение для автоматической активации промокодов на серверах сообщества по игре Rust."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.142.2",
    "httpx2>=2.13.1",
    "openai>=3.24.0",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle
    "F",      # pyflakes
    "I",      # isort
    "B",      # bugbear
    "UP",     # pyupgrade
    "ASYNC",  # ошибки в async-коде
    "FAST",   # специфичные для FastAPI
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
